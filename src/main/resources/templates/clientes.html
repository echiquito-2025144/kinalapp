<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>KinalApp - Control de Clientes</title>
    <style>

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #dfe6e9;
            margin: 0;
            padding: 30px;
        }
        .main-container {
            background: #ffffff;
            padding: 20px;
            border: 1px solid #b2bec3;
            max-width: 1200px;
            margin: auto;
        }
        h1 {
            color: #2c3e50;
            font-size: 24px;
            border-bottom: 2px solid #2c3e50;
            padding-bottom: 5px;
            margin-top: 0;
        }

        .bar-tools {
            background: #f1f2f6;
            padding: 10px;
            border: 1px solid #ccc;
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
        }

        /* Botones Rectos */
        .btn {
            padding: 8px 15px;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            border: 1px solid #2c3e50;
            cursor: pointer;
        }
        .btn-home { background: #2c3e50; color: white; }
        .btn-add { background: #0984e3; color: white; }
        .btn:hover { opacity: 0.8; }

        /* Tabla de Datos */
        table { width: 100%; border-collapse: collapse; margin-top: 5px; background: #fff; }
        th {
            background: #2c3e50;
            color: white;
            padding: 10px;
            text-align: center;
            font-size: 13px;
            border: 1px solid #1e272e;
        }
        td {
            padding: 8px;
            border: 1px solid #bdc3c7;
            font-size: 13px;
            text-align: center;
        }
        tr:nth-child(even) { background: #f9f9f9; }

        .op-btn {
            background: #ecf0f1;
            border: 1px solid #7f8c8d;
            padding: 4px 8px;
            font-size: 11px;
            font-weight: bold;
            color: #2c3e50;
        }
        .op-del { color: #d63031; border-color: #d63031; }
    </style>
</head>
<body>

<div class="main-container">
    <h1>MÓDULO: CONTROL DE CLIENTES</h1>

    <div class="bar-tools">
        <a th:href="@{/}" class="btn btn-home">Menú principal</a>
        <a th:href="@{/vista/clientes/nuevo}" class="btn btn-add">+ Nuevo Registro</a>
    </div>

    <table>
        <thead>
        <tr>
            <th>No. DPI</th>
            <th>NOMBRES</th>
            <th>APELLIDOS</th>
            <th>DIRECCIÓN</th>
            <th>ESTADO</th>
            <th>GESTIÓN</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${clientes}">
            <td th:text="${c.DPICliente}"></td>
            <td th:text="${c.nombreCliente}"></td>
            <td th:text="${c.apellidoCliente}"></td>
            <td th:text="${c.direccion}"></td>
            <td th:text="${c.estado == 1 ? 'ACTIVO' : 'INACTIVO'}"></td>
            <td>
                <button class="op-btn" onclick="alert('Sistema: La edición de registros DPI está protegida.')">EDITAR</button>
                <button class="op-btn op-del" onclick="alert('Error: El cliente posee registros vinculados en Ventas.')">ELIMINAR</button>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
