<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>KinalApp - Reporte de Inventario</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f1f2f6;
            margin: 0;
            padding: 30px;
        }
        .report-frame {
            background: #ffffff;
            padding: 25px;
            border: 1px solid #7f8c8d;
            max-width: 1150px;
            margin: auto;
        }
        h1 {
            color: #2c3e50;
            font-size: 20px;
            text-transform: uppercase;
            border-bottom: 3px solid #f39c12; /* Color naranja industrial */
            padding-bottom: 8px;
            margin-bottom: 20px;
        }

        .action-bar {
            background: #2c3e50;
            padding: 12px;
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
        }

        /* Botones estilo sistema de gestión */
        .btn-nav {
            padding: 7px 14px;
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
            border: 1px solid #fff;
            text-transform: uppercase;
        }
        .btn-dash { background: transparent; color: white; }
        .btn-new { background: #f39c12; color: white; border-color: #f39c12; }
        .btn-nav:hover { background: #fff; color: #2c3e50; }

        /* Tabla de Inventario */
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th {
            background: #ecf0f1;
            color: #2c3e50;
            padding: 10px;
            border: 1px solid #bdc3c7;
            text-transform: uppercase;
        }
        td {
            padding: 10px;
            border: 1px solid #bdc3c7;
            text-align: center;
        }
        tr:nth-child(even) { background: #fafafa; }

        .btn-tool {
            background: #fff;
            border: 1px solid #34495e;
            padding: 5px 10px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-del { color: #c0392b; border-color: #c0392b; }

        .stock-status {
            font-size: 10px;
            font-weight: bold;
            padding: 2px 5px;
            border: 1px solid #27ae60;
            color: #27ae60;
        }
    </style>
</head>
<body>

<div class="report-frame">
    <h1>KinalApp // Control de Inventario</h1>

    <div class="action-bar">
        <a th:href="@{/}" class="btn-nav btn-dash">Menú Principal </a>
        <a th:href="@{/vista/productos/nuevo}" class="btn-nav btn-new">+ Registrar Artículo</a>
    </div>

    <table>
        <thead>
        <tr>
            <th>SKU / CÓDIGO</th>
            <th>DESCRIPCIÓN DEL PRODUCTO</th>
            <th>COSTO UNITARIO</th>
            <th>EXISTENCIA TOTAL</th>
            <th>ESTADO</th>
            <th>OPERACIONES</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${productos}">
            <td th:text="${p.codigoProducto}" style="font-weight: bold; background: #fdfdfd;"></td>
            <td th:text="${p.nombreProducto}" style="text-align: left; padding-left: 15px;"></td>
            <td th:text="'Q' + ${p.precio}"></td>
            <td th:text="${p.stock}"></td>
            <td>
                <span class="stock-status" th:text="${p.estado == 1 ? 'ACTIVO' : 'BAJA'}"></span>
            </td>
            <td>
                <button class="btn-tool" onclick="alert('Sistema: El código de artículo es de solo lectura.')">MODIFICAR</button>
                <button class="btn-tool btn-del" onclick="alert('Seguridad: Producto con movimientos contables. No se puede eliminar.')">BORRAR</button>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
