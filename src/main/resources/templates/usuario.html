<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Usuarios</title>
</head>
<body>

<h1>Usuarios</h1>

<!-- Botón para crear nuevo usuario -->
<a href="/vista/usuarios/nuevo">Nuevo Usuario</a>

<!-- Tabla de usuarios -->
<table border="1">
    <thead>
    <tr>
        <th>Código</th>
        <th>Username</th>
        <th>Password</th>
        <th>Email</th>
        <th>Rol</th>
        <th>Estado</th>
        <th>Acciones</th>
    </tr>
    </thead>
    <tbody>

    <tr th:each="u : ${usuarios}">
        <td th:text="${u.codigoUsuario}"></td>
        <td th:text="${u.username}"></td>
        <td th:text="${u.password}"></td>
        <td th:text="${u.email}"></td>
        <td th:text="${u.rol}"></td>
        <td th:text="${u.estado}"></td>

        <td>
            <!-- Botones bloqueados -->
            <button type="button"
                    onclick="mostrarMensajeEditar()">
                Editar
            </button>

            <button type="button"
                    onclick="mostrarMensajeEliminar()">
                Eliminar
            </button>
        </td>
    </tr>

    </tbody>
</table>

<script>
    function mostrarMensajeEditar() {
        alert("No se puede editar la llave primaria (codigoUsuario)");
    }

    function mostrarMensajeEliminar() {
        alert("No se puede eliminar este usuario");
    }
</script>

</body>
</html>
