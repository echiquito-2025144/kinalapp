<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>KinalApp - Login</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #2c3e50; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; width: 350px; padding: 40px; border-top: 8px solid #27ae60; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border-radius: 4px; }
        h2 { text-align: center; color: #2c3e50; text-transform: uppercase; margin-bottom: 25px; letter-spacing: 1px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 11px; font-weight: bold; color: #7f8c8d; margin-bottom: 5px; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; box-sizing: border-box; border-radius: 3px; outline: none; }
        input:focus { border-color: #27ae60; }
        .btn { width: 100%; padding: 12px; border: none; background: #27ae60; color: white; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: background 0.3s; }
        .btn:hover { background: #219150; }
        .error { background: #f8d7da; color: #721c24; padding: 10px; font-size: 12px; margin-bottom: 15px; text-align: center; border: 1px solid #f5c6cb; border-radius: 3px; }
        .success { background: #d4edda; color: #155724; padding: 10px; font-size: 12px; margin-bottom: 15px; text-align: center; border: 1px solid #c3e6cb; border-radius: 3px; }
        .link { display: block; text-align: center; margin-top: 15px; font-size: 12px; color: #3498db; text-decoration: none; }
        .link:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="card">
    <h2>Sistema Acceso</h2>

    <!-- CAMBIO CLAVE: Spring Security envía el error como parámetro en la URL (?error) -->
    <div th:if="${param.error}" class="error">
        Usuario o contraseña incorrectos.
    </div>

    <!-- Mensaje de éxito al registrarse -->
    <div th:if="${param.success}" class="success">
        ¡Cuenta creada con éxito!
    </div>

    <!-- El action debe ser /login y el method POST para que Spring Security lo intercepte -->
    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label>USUARIO:</label>
            <input type="text" name="username" placeholder="Ingresa tu usuario" required autofocus>
        </div>
        <div class="form-group">
            <label>CONTRASEÑA:</label>
            <input type="password" name="password" placeholder="Ingresa tu clave" required>
        </div>
        <button type="submit" class="btn">Entrar al Sistema</button>
    </form>

    <a th:href="@{/registro}" class="link">¿No tienes cuenta? Regístrate</a>
</div>
</body>
</html>
