<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Clientes</title>
</head>
<body>

<h1>Clientes</h1>

<!-- Botón para crear nuevo cliente -->
<a href="/vista/clientes/nuevo">Nuevo Cliente</a>

<!-- Tabla de clientes -->
<table border="1">
    <thead>
    <tr>
        <th>DPI</th>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>Dirección</th>
        <th>Estado</th>
        <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <!-- Recorremos la lista de clientes -->
    <tr th:each="c : ${clientes}">
        <td th:text="${c.DPICliente}"></td>
        <td th:text="${c.nombreCliente}"></td>
        <td th:text="${c.apellidoCliente}"></td>
        <td th:text="${c.direccion}"></td>
        <td th:text="${c.estado}"></td>
        <td>
            <!-- Bloqueamos editar y eliminar mostrando un mensaje -->
            <button type="button" onclick="alert('No se puede modificar la llave primaria')">Editar</button>
            <button type="button" onclick="alert('No se puede eliminar la llave primaria')">Eliminar</button>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
