<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>KinalApp - Control de Accesos</title>
    <style>
        body {
            font-family: Tahoma, Geneva, sans-serif;
            background-color: #ecf0f1;
            margin: 0;
            padding: 30px;
        }
        .main-panel {
            background: #ffffff;
            border: 1px solid #27ae60;
            max-width: 1100px;
            margin: auto;
            padding: 20px;
        }
        h1 {
            color: #1e8449;
            font-size: 22px;
            margin-top: 0;
            border-bottom: 2px solid #27ae60;
            padding-bottom: 8px;
        }

        .tool-container {
            background: #f4f9f4;
            padding: 10px;
            border: 1px solid #d5e8d4;
            margin-bottom: 15px;
            display: flex;
            gap: 12px;
        }

        /* Botones Rectangulares */
        .btn-link {
            padding: 8px 16px;
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
            border: 1px solid #1e8449;
            text-transform: uppercase;
        }
        .btn-back { background: #34495e; color: white; border-color: #2c3e50; }
        .btn-create { background: #27ae60; color: white; }
        .btn-link:hover { filter: brightness(1.1); }

        /* Tabla de Usuarios */
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th {
            background: #27ae60;
            color: white;
            padding: 12px;
            text-align: center;
            border: 1px solid #1e8449;
        }
        td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: center;
        }
        tr:nth-child(even) { background: #fdfdfd; }
        tr:hover { background: #e8f5e9; }

        .sys-btn {
            background: #fff;
            border: 1px solid #7f8c8d;
            padding: 5px 10px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }
        .sys-del { color: #c0392b; border-color: #c0392b; }

        .tag-active { color: #27ae60; font-weight: bold; }
        .tag-inactive { color: #7f8c8d; }
    </style>
</head>
<body>

<div class="main-panel">
    <h1>ADMINISTRACIÓN DE USUARIOS Y ROLES</h1>

    <div class="tool-container">
        <a th:href="@{/}" class="btn-link btn-back">IR AL DASHBOARD</a>
        <a th:href="@{/vista/usuarios/nuevo}" class="btn-link btn-create">+ NUEVO USUARIO</a>
    </div>

    <table>
        <thead>
        <tr>
            <th>ID USUARIO</th>
            <th>NOMBRE DE ACCESO</th>
            <th>CORREO ELECTRÓNICO</th>
            <th>ROL ASIGNADO</th>
            <th>ESTADO</th>
            <th>OPERACIONES</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${usuarios}">
            <td th:text="${u.codigoUsuario}" style="font-weight: bold;"></td>
            <td th:text="${u.username}"></td>
            <td th:text="${u.email}"></td>
            <td th:text="${u.rol}"></td>
            <td>
                <span th:class="${u.estado == 1 ? 'tag-active' : 'tag-inactive'}"
                      th:text="${u.estado == 1 ? 'HABILITADO' : 'SUSPENDIDO'}"></span>
            </td>
            <td>
                <button type="button" class="sys-btn" onclick="alert('Seguridad: El identificador de usuario es inalterable.')">MODIFICAR</button>
                <button type="button" class="sys-btn sys-del" onclick="alert('Acceso Denegado: El usuario tiene registros históricos vinculados.')">ELIMINAR</button>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
