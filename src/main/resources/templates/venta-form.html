<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar Venta</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; padding: 50px; }
        .card { background: white; padding: 35px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h2 { color: #007bff; margin-top: 0; text-align: center; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #444; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        input:focus, select:focus { border-color: #007bff; outline: none; box-shadow: 0 0 5px rgba(0,123,255,0.2); }
        .btn-submit { background-color: #28a745; color: white; border: none; padding: 14px; width: 100%; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 15px; }
        .btn-submit:hover { background-color: #218838; }
        .btn-cancel { display: block; text-align: center; margin-top: 20px; color: #dc3545; text-decoration: none; font-weight: 500; }
    </style>
</head>
<body>

<div class="card">
    <h2>Nueva Venta</h2>
    <form th:action="@{/vista/ventas/guardar}" th:object="${venta}" method="post">

        <div class="form-group">
            <label>Código de Venta (ID):</label>
            <input type="number" th:field="*{codigoVenta}" placeholder="Ingrese ID único" required />
        </div>

        <div class="form-group">
            <label>Fecha de Operación:</label>
            <input type="date" th:field="*{fechaVenta}" required />
        </div>

        <div class="form-group">
            <label>Cliente Receptor (FK):</label>
            <select th:field="*{cliente}" required>
                <option value="">-- Seleccione Cliente --</option>
                <option th:each="c : ${clientes}"
                        th:value="${c.DPICliente}"
                        th:text="${c.nombreCliente + ' ' + c.apellidoCliente}"></option>
            </select>
        </div>

        <div class="form-group">
            <label>Vendedor Asignado (FK):</label>
            <select th:field="*{usuario}" required>
                <option value="">-- Seleccione Vendedor --</option>
                <option th:each="u : ${usuarios}"
                        th:value="${u.codigoUsuario}"
                        th:text="${u.nombreUsuario}"></option>
            </select>
        </div>

        <div class="form-group">
            <label>Monto Total (Q):</label>
            <input type="number" step="0.01" th:field="*{total}" placeholder="0.00" required />
        </div>

        <div class="form-group">
            <label>Estado Inicial:</label>
            <select th:field="*{estado}">
                <option value="1">Activa</option>
                <option value="0">Finalizada</option>
            </select>
        </div>

        <button type="submit" class="btn-submit">Registrar Venta</button>
        <a th:href="@{/vista/ventas}" class="btn-cancel">Cancelar y Volver</a>
    </form>
</div>

</body>
</html>
