<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>KinalApp - Autenticación</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: #2c3e50; /* Fondo oscuro industrial */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: #ffffff;
            width: 350px;
            padding: 40px;
            border-top: 10px solid #27ae60; /* Verde Kinal */
            box-shadow: 0 15px 25px rgba(0,0,0,0.3);
        }
        .login-header { text-align: center; margin-bottom: 30px; }
        .login-header img { width: 120px; }
        .login-header h2 {
            font-size: 18px;
            color: #2c3e50;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 10px;
        }

        .form-group { margin-bottom: 20px; }
        label {
            display: block;
            font-size: 11px;
            font-weight: bold;
            color: #7f8c8d;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #bdc3c7;
            box-sizing: border-box;
            font-size: 14px;
            background: #f9f9f9;
        }
        input:focus { border-color: #27ae60; outline: none; background: #fff; }

        .btn-access {
            background: #27ae60;
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
        }
        .btn-access:hover { background: #219150; }

        .error-msg {
            background: #f8d7da;
            color: #721c24;
            padding: 10px;
            font-size: 12px;
            margin-bottom: 15px;
            border: 1px solid #f5c6cb;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <h2>KinalApp System</h2>
        <p style="font-size: 10px; color: #95a5a6;">CONTROL DE INVENTARIO V1.0</p>
    </div>

    <div th:if="${error}" class="error-msg" th:text="${error}"></div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label>USUARIO:</label>
            <input type="text" name="username" placeholder="Ingrese su ID" required>
        </div>

        <div class="form-group">
            <label>CONTRASEÑA:</label>
            <input type="password" name="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-access">Iniciar Sesión</button>
    </form>

    <div style="text-align: center; margin-top: 20px;">
        <p style="font-size: 10px; color: #bdc3c7;">© 2026 Grupo Técnico Kinal</p>
    </div>
</div>

</body>
</html>
