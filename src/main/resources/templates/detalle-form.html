<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Detalle</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; padding: 50px; }
        .card { background: white; padding: 35px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        h2 { color: #e67e22; text-align: center; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .btn-save { background-color: #e67e22; color: white; border: none; padding: 14px; width: 100%; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 15px; }
        .btn-cancel { display: block; text-align: center; margin-top: 15px; color: #666; text-decoration: none; }
    </style>
</head>
<body>

<div class="card">
    <h2>Registrar Detalle</h2>
    <form th:action="@{/vista/detalles/guardar}" th:object="${detalle}" method="post">

        <div class="form-group">
            <label>Código Detalle (PK):</label>
            <input type="number" th:field="*{codigoDetalleVenta}" required />
        </div>

        <div class="form-group">
            <label>Seleccionar Venta (FK):</label>
            <select th:field="*{venta}" required>
                <option value="">-- Elija la Factura --</option>
                <option th:each="v : ${ventas}" th:value="${v.codigoVenta}" th:text="'Venta #' + ${v.codigoVenta}"></option>
            </select>
        </div>

        <div class="form-group">
            <label>Seleccionar Producto (FK):</label>
            <select th:field="*{productos}" required>
                <option value="">-- Elija el Producto --</option>
                <option th:each="p : ${productos}" th:value="${p.codigoProducto}" th:text="${p.nombreProducto}"></option>
            </select>
        </div>

        <div class="form-group">
            <label>Cantidad:</label>
            <input type="number" th:field="*{cantidad}" required />
        </div>

        <div class="form-group">
            <label>Precio Unitario (Q):</label>
            <input type="number" step="0.01" th:field="*{precioUnitario}" required />
        </div>

        <div class="form-group">
            <label>Subtotal (Q):</label>
            <input type="number" step="0.01" th:field="*{subtotal}" required />
        </div>

        <button type="submit" class="btn-save">Guardar Detalle</button>
        <a th:href="@{/vista/detalles}" class="btn-cancel">Regresar</a>
    </form>
</div>

</body>
</html>
