<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>KinalApp - Nuevo Usuario</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; padding: 50px; }
        .card { background: white; padding: 35px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { color: #28a745; text-align: center; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .btn-save { background-color: #28a745; color: white; border: none; padding: 14px; width: 100%; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 15px; }
        .btn-save:hover { background-color: #218838; }
        .btn-cancel { display: block; text-align: center; margin-top: 15px; color: #dc3545; text-decoration: none; font-weight: 500; font-size: 14px; }
        .btn-home { display: block; text-align: center; margin-top: 10px; color: #666; text-decoration: none; font-size: 13px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Nuevo Usuario</h2>
    <form th:action="@{/vista/usuarios/guardar}" th:object="${usuario}" method="post">

        <div class="form-group">
            <label>Código Usuario (PK):</label>
            <input type="number" th:field="*{codigoUsuario}" required placeholder="ID numérico" />
        </div>

        <div class="form-group">
            <label>Username:</label>
            <input type="text" th:field="*{username}" required placeholder="Nombre de acceso" />
        </div>

        <div class="form-group">
            <label>Password:</label>
            <input type="password" th:field="*{password}" required placeholder="Contraseña segura" />
        </div>

        <div class="form-group">
            <label>Email:</label>
            <input type="email" th:field="*{email}" required placeholder="correo@ejemplo.com" />
        </div>

        <div class="form-group">
            <label>Rol:</label>
            <input type="text" th:field="*{rol}" placeholder="Admin / Vendedor" />
        </div>

        <div class="form-group">
            <label>Estado (1 Activo):</label>
            <input type="number" th:field="*{estado}" required />
        </div>

        <button type="submit" class="btn-save">Guardar Usuario</button>

        <a th:href="@{/vista/usuarios}" class="btn-cancel">← Volver al Listado</a>
        <a th:href="@{/}" class="btn-home">🏠 Ir al Dashboard Principal</a>
    </form>
</div>

</body>
</html>
