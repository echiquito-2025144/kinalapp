<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>KinalApp - Login</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #2c3e50; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; width: 350px; padding: 40px; border-top: 8px solid #27ae60; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h2 { text-align: center; color: #2c3e50; text-transform: uppercase; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 11px; font-weight: bold; color: #7f8c8d; margin-bottom: 5px; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; border: none; background: #27ae60; color: white; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .error { background: #f8d7da; color: #721c24; padding: 10px; font-size: 12px; margin-bottom: 15px; text-align: center; border: 1px solid #f5c6cb; }
        .success { background: #d4edda; color: #155724; padding: 10px; font-size: 12px; margin-bottom: 15px; text-align: center; border: 1px solid #c3e6cb; }
        .link { display: block; text-align: center; margin-top: 15px; font-size: 12px; color: #3498db; text-decoration: none; }
    </style>
</head>
<body>
<div class="card">
    <h2>Sistema Acceso</h2>
    <div th:if="${error}" class="error" th:text="${error}"></div>
    <div th:if="${param.success}" class="success">Cuenta creada. ¡Inicia sesión!</div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label>USUARIO:</label>
            <input type="text" name="username" required>
        </div>
        <div class="form-group">
            <label>CONTRASEÑA:</label>
            <input type="password" name="password" required>
        </div>
        <button type="submit" class="btn">Entrar al Sistema</button>
    </form>
    <a th:href="@{/registro}" class="link">¿No tienes cuenta? Regístrate</a>
</div>
</body>
</html>
