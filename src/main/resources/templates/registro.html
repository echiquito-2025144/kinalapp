<body>
<div class="register-container">
    <h2>Únete 🚀</h2>
    <p class="subtitle">Crea tu cuenta de KinalApp</p>

    <form th:action="@{/registro/guardar}" method="post" th:object="${usuario}">

        <div class="form-group">
            <label for="username">Nombre de usuario</label>
            <input type="text" th:field="*{username}" id="username" placeholder="Ej: erick_dev" required>
        </div>

        <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" th:field="*{email}" id="email" placeholder="correo@ejemplo.com" required>
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" th:field="*{password}" id="password" placeholder="Mínimo 6 caracteres" required>
        </div>

        <button type="submit" class="btn-register">Crear mi cuenta</button>
    </form>

    <a th:href="@{/login}" class="login-link">
        ¿Ya tienes cuenta? <strong>Inicia sesión</strong>
    </a>
</div>
</body>
