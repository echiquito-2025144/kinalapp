<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Producto</title>
</head>
<body>

<h1>Datos del Producto</h1>

<form th:action="@{/vista/productos/guardar}" th:object="${producto}" method="post">

    <label>Código Producto:</label>
    <input type="number" th:field="*{codigoProducto}" required />
    <br><br>

    <label>Nombre:</label>
    <input type="text" th:field="*{nombreProducto}" required />
    <br><br>

    <label>Precio:</label>
    <input type="number" step="0.01" th:field="*{precio}" required />
    <br><br>

    <label>Stock:</label>
    <input type="number" th:field="*{stock}" required />
    <br><br>

    <label>Estado:</label>
    <input type="number" th:field="*{estado}" />
    <br><br>

    <button type="submit">Guardar Producto</button>
    <a th:href="@{/vista/productos}">Cancelar</a>

</form>

</body>
</html>
